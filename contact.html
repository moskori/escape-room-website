<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | 超・脱出</title>
  <meta name="description" content="超・脱出へのお問い合わせフォームです。公演についてのご質問や取材・メディア掲載などはこちらからご連絡ください。">
  <meta property="og:title" content="お問い合わせ | 超・脱出">
  <meta property="og:description" content="超・脱出へのお問い合わせフォームです。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://moskori.github.io/escape-room-website/contact.html">
  <link rel="canonical" href="https://moskori.github.io/escape-room-website/contact.html">
  <link rel="stylesheet" href="style.css?v=22">
  <style>
    .contact-page main { max-width: 900px; }
    .contact-page .contact-section { display: block; max-width: 760px; }
    .contact-page .contact-main { width: 100%; }
    .contact-page .contact-page-heading { margin: 0 0 20px; font-size: clamp(34px, 5vw, 52px); }
  </style>
</head>
<body class="contact-page">
  <nav class="site-nav">
    <a href="./" class="nav-logo" aria-label="超・脱出 ホーム">
      <img src="images/透過版超・脱出ロゴ.png" alt="超・脱出" class="nav-logo-image">
    </a>
    <div class="nav-links">
      <a href="./#about">ABOUT</a>
      <a href="games/">GAMES</a>
      <a href="./#access">ACCESS</a>
      <a href="./#faq">FAQ</a>
      <a href="contact.html" aria-current="page">CONTACT</a>
    </div>
    <div class="nav-actions">
      <a class="nav-games-button" href="games/">公演を探す</a>
      <button class="menu-button" type="button" aria-label="メニューを開く" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <main>
    <section class="contact-section">
      <div class="contact-main">
        <p class="section-label">CONTACT</p>
        <h1 class="contact-page-heading">お問い合わせ</h1>
        <p class="contact-description">
          公演についてのご質問、取材・メディア掲載などはこちらからお問い合わせください。
          送信ボタンを押すと、お使いのメールアプリが開きます。
        </p>

        <form class="contact-form" id="contact-form">
          <div class="contact-form-field">
            <label for="contact-name">お名前 <span>必須</span></label>
            <input id="contact-name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="contact-form-field">
            <label for="contact-email">メールアドレス <span>必須</span></label>
            <input id="contact-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="contact-form-field">
            <label for="contact-subject">お問い合わせ項目 <span>必須</span></label>
            <select id="contact-subject" name="subject" required>
              <option value="" selected disabled>選択してください</option>
              <option value="公演について">公演について</option>
              <option value="取材・メディア掲載">取材・メディア掲載</option>
              <option value="その他">その他</option>
            </select>
          </div>
          <div class="contact-form-field">
            <label for="contact-message">お問い合わせ内容 <span>必須</span></label>
            <textarea id="contact-message" name="message" rows="6" required></textarea>
          </div>
          <button class="contact-primary-button" type="submit">メールアプリで問い合わせる <span>→</span></button>
          <p class="contact-form-note">送信前に内容を確認し、メールアプリ上で送信してください。メールアプリが開かない場合は <a href="mailto:cho.dassyutsu@gmail.com">cho.dassyutsu@gmail.com</a> へ直接ご連絡ください。</p>
          <p class="contact-form-status" id="contact-form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer"><p>© 2026 超・脱出</p></footer>
  <script src="script.js?v=6"></script>
</body>
</html>
